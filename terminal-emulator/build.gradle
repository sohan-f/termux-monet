apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// ABIs to compile native code for. Honours the same option as :app so that
// e.g. TERMUX_BUILD_ABI=arm64-v8a or -Ptermux.buildAbi=arm64-v8a builds only
// for the target arch. See app/build.gradle for the accepted values.
def getTargetAbis() {
    def allAbis = ['x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a']
    def rawValue = (project.findProperty("termux.buildAbi") ?: System.getenv("TERMUX_BUILD_ABI") ?: "").toString().trim()
    if (rawValue.isEmpty() || rawValue.equalsIgnoreCase("all") || rawValue.equalsIgnoreCase("universal") || rawValue == "*") {
        return allAbis
    }
    def aliasMap = [
        "arm64"      : "arm64-v8a",
        "aarch64"    : "arm64-v8a",
        "arm64-v8a"  : "arm64-v8a",
        "arm"        : "armeabi-v7a",
        "arm32"      : "armeabi-v7a",
        "armeabi"    : "armeabi-v7a",
        "armeabi-v7a": "armeabi-v7a",
        "armv7"      : "armeabi-v7a",
        "x86_64"     : "x86_64",
        "x64"        : "x86_64",
        "x86-64"     : "x86_64",
        "x86"        : "x86",
        "i386"       : "x86",
        "i686"       : "x86"
    ]
    def selected = []
    rawValue.split(",").each { part ->
        def key = part.trim().toLowerCase()
        if (key.isEmpty()) return
        def mapped = aliasMap[key]
        if (mapped == null) {
            throw new GradleException("Invalid ABI '${part.trim()}'. Valid values are 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' (aliases 'arm64', 'arm', 'x64' allowed), comma-separated, or 'all'. Set via '-Ptermux.buildAbi=<abi>' or 'TERMUX_BUILD_ABI=<abi>'.")
        }
        if (!selected.contains(mapped)) selected.add(mapped)
    }
    if (selected.isEmpty()) return allAbis
    return allAbis.findAll { selected.contains(it) }
}

def targetAbis = getTargetAbis()

android {
    namespace "com.termux.emulator"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters(*targetAbis)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
