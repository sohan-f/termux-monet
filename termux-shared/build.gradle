apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// ABIs to compile native code for. Honours the same option as :app so that
// e.g. TERMUX_BUILD_ABI=arm64-v8a or -Ptermux.buildAbi=arm64-v8a builds only
// for the target arch. See app/build.gradle for the accepted values.
def getTargetAbis() {
    def allAbis = ['x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a']
    def rawValue = (project.findProperty("termux.buildAbi") ?: System.getenv("TERMUX_BUILD_ABI") ?: "").toString().trim()
    if (rawValue.isEmpty() || rawValue.equalsIgnoreCase("all") || rawValue.equalsIgnoreCase("universal") || rawValue == "*") {
        return allAbis
    }
    def aliasMap = [
        "arm64"      : "arm64-v8a",
        "aarch64"    : "arm64-v8a",
        "arm64-v8a"  : "arm64-v8a",
        "arm"        : "armeabi-v7a",
        "arm32"      : "armeabi-v7a",
        "armeabi"    : "armeabi-v7a",
        "armeabi-v7a": "armeabi-v7a",
        "armv7"      : "armeabi-v7a",
        "x86_64"     : "x86_64",
        "x64"        : "x86_64",
        "x86-64"     : "x86_64",
        "x86"        : "x86",
        "i386"       : "x86",
        "i686"       : "x86"
    ]
    def selected = []
    rawValue.split(",").each { part ->
        def key = part.trim().toLowerCase()
        if (key.isEmpty()) return
        def mapped = aliasMap[key]
        if (mapped == null) {
            throw new GradleException("Invalid ABI '${part.trim()}'. Valid values are 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' (aliases 'arm64', 'arm', 'x64' allowed), comma-separated, or 'all'. Set via '-Ptermux.buildAbi=<abi>' or 'TERMUX_BUILD_ABI=<abi>'.")
        }
        if (!selected.contains(mapped)) selected.add(mapped)
    }
    if (selected.isEmpty()) return allAbis
    return allAbis.findAll { selected.contains(it) }
}

def targetAbis = getTargetAbis()

android {
    namespace = "com.termux.shared"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    dependencies {
        implementation "androidx.appcompat:appcompat:1.7.0"
        implementation "androidx.annotation:annotation:1.9.0"

        implementation "androidx.core:core:1.13.1"
        implementation "com.google.android.material:material:1.14.0"
        implementation "com.google.guava:guava:32.0.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"

        implementation "androidx.window:window:1.3.0"

        // Bumping commons-io to a version higher than 2.5
        // will cause runtime exceptions on android < 8 due
        // to missing classes like java.nio.file.Path.
        implementation "commons-io:commons-io:2.16.1"

        implementation project(":terminal-view")

        implementation project(":termux-am-library")
    }

    defaultConfig {
        compileSdkVersion project.properties.compileSdkVersion.toInteger()
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            ndkBuild {
                cppFlags ''
            }
        }

        ndk {
            abiFilters(*targetAbis)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'termux-shared'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
